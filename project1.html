<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <title>Document</title>

  <link rel="stylesheet" href="project1.css">

</head>


<body>


<div class="cruds">

<div class="head">
<h1>CRUD</h1>
<p>PRODUCT MANAGMENT SYSTEM</p>
</div>


<div class="inputs">

<input type="text"  placeholder="title"   id="title"  >


<div class="prices">

<input type="number" onkeyup="gettotal()"  placeholder="price"   id="price"> 
<input type="number" onkeyup="gettotal()" placeholder="taxes"   id="taxes"> 
<input type="number" onkeyup="gettotal()" placeholder="ads"   id="ads"> 
<input type="number" onkeyup="gettotal()" placeholder="discount"   id="discount"> 
<p id="total"></p>
</div>

<input type="number"  placeholder="count"   id="count"> 
<input type="text"  placeholder="category"   id="category"> 
<button id="submit">create</button>

</div>


<div class="outputs">
<div class="searchBlock">
<input type="text"  placeholder="search"   id="search"> 

<button  onclick="removeall()"  class="hide" id="deleteall"> </button>

<div class="btnsearch">
<button id="searchtitle">search by title</button>
<button id="searchcategory" >search by category</button>
</div>
</div>

<table>

<tr>
     <th>id</th>
     <th>title</th>
     <th>price</th>
     <th>taxes</th>
     <th>ads</th>
     <th>discount</th>
     <th>total</th>
     <th>category</th>
     <th>update</th>
     <th>delete</th>
</tr>

<tbody id="tbody">

 
</tbody>


</table>


</div>




</div>


<script  src="project1.js"></script>
</body>


</html>
